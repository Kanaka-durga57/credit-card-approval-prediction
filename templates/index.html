<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Credit Card Risk Prediction</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="form-card">

            <h1>Credit Card Risk Prediction</h1>

            <p class="subtitle">
                Enter the applicant details to predict credit risk.
            </p>


            <form action="/predict" method="POST">


                <!-- ================================= -->
                <!-- PERSONAL INFORMATION -->
                <!-- ================================= -->

                <h2>Personal Information</h2>

                <div class="form-grid">

                    <div class="form-group">

                        <label>Gender</label>

                        <select name="CODE_GENDER" required>

                            <option value="">Select Gender</option>

                            <option value="M">
                                Male
                            </option>

                            <option value="F">
                                Female
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Number of Children</label>

                        <input
                            type="number"
                            name="CNT_CHILDREN"
                            min="0"
                            max="20"
                            value="0"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Family Members</label>

                        <input
                            type="number"
                            name="CNT_FAM_MEMBERS"
                            min="1"
                            step="0.1"
                            value="2"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Own Car?</label>

                        <select name="FLAG_OWN_CAR" required>

                            <option value="">Select</option>

                            <option value="Y">
                                Yes
                            </option>

                            <option value="N">
                                No
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Own Property?</label>

                        <select name="FLAG_OWN_REALTY" required>

                            <option value="">Select</option>

                            <option value="Y">
                                Yes
                            </option>

                            <option value="N">
                                No
                            </option>

                        </select>

                    </div>


                </div>


                <!-- ================================= -->
                <!-- FINANCIAL INFORMATION -->
                <!-- ================================= -->

                <h2>Financial Information</h2>

                <div class="form-grid">


                    <div class="form-group">

                        <label>Annual Income</label>

                        <input
                            type="number"
                            name="AMT_INCOME_TOTAL"
                            min="0"
                            step="0.01"
                            placeholder="Example: 180000"
                            required
                        >

                    </div>


                    <div class="form-group">

                        <label>Income Type</label>

                        <select name="NAME_INCOME_TYPE" required>

                            <option value="">
                                Select Income Type
                            </option>

                            <option value="Working">
                                Working
                            </option>

                            <option value="Commercial associate">
                                Commercial associate
                            </option>

                            <option value="Pensioner">
                                Pensioner
                            </option>

                            <option value="State servant">
                                State servant
                            </option>

                            <option value="Student">
                                Student
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Education</label>

                        <select name="NAME_EDUCATION_TYPE" required>

                            <option value="">
                                Select Education
                            </option>

                            <option value="Secondary / secondary special">
                                Secondary / secondary special
                            </option>

                            <option value="Higher education">
                                Higher education
                            </option>

                            <option value="Incomplete higher">
                                Incomplete higher
                            </option>

                            <option value="Lower secondary">
                                Lower secondary
                            </option>

                            <option value="Academic degree">
                                Academic degree
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Family Status</label>

                        <select name="NAME_FAMILY_STATUS" required>

                            <option value="">
                                Select Family Status
                            </option>

                            <option value="Single / not married">
                                Single / not married
                            </option>

                            <option value="Married">
                                Married
                            </option>

                            <option value="Civil marriage">
                                Civil marriage
                            </option>

                            <option value="Separated">
                                Separated
                            </option>

                            <option value="Widow">
                                Widow
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Housing Type</label>

                        <select name="NAME_HOUSING_TYPE" required>

                            <option value="">
                                Select Housing Type
                            </option>

                            <option value="House / apartment">
                                House / apartment
                            </option>

                            <option value="With parents">
                                With parents
                            </option>

                            <option value="Municipal apartment">
                                Municipal apartment
                            </option>

                            <option value="Rented apartment">
                                Rented apartment
                            </option>

                            <option value="Office apartment">
                                Office apartment
                            </option>

                            <option value="Co-op apartment">
                                Co-op apartment
                            </option>

                        </select>

                    </div>


                </div>


                <!-- ================================= -->
                <!-- EMPLOYMENT INFORMATION -->
                <!-- ================================= -->

                <h2>Employment Information</h2>

                <div class="form-grid">


                    <div class="form-group">

                        <label>Age (Years)</label>

                        <input
                            type="number"
                            id="age"
                            min="18"
                            max="100"
                            placeholder="Example: 25"
                            required
                        >

                        <!-- Hidden dataset value -->

                        <input
                            type="hidden"
                            name="DAYS_BIRTH"
                            id="days_birth"
                        >

                    </div>


                    <div class="form-group">

                        <label>Employment Experience (Years)</label>

                        <input
                            type="number"
                            id="employment_years"
                            min="0"
                            max="60"
                            step="0.1"
                            placeholder="Example: 3"
                            required
                        >

                        <!-- Hidden dataset value -->

                        <input
                            type="hidden"
                            name="DAYS_EMPLOYED"
                            id="days_employed"
                        >

                    </div>


                    <div class="form-group">

                        <label>Occupation</label>

                        <select name="OCCUPATION_TYPE" required>

                            <option value="">
                                Select Occupation
                            </option>

                            <option value="Unknown">
                                Unknown
                            </option>

                            <option value="Laborers">
                                Laborers
                            </option>

                            <option value="Core staff">
                                Core staff
                            </option>

                            <option value="Accountants">
                                Accountants
                            </option>

                            <option value="Managers">
                                Managers
                            </option>

                            <option value="Sales staff">
                                Sales staff
                            </option>

                            <option value="Drivers">
                                Drivers
                            </option>

                            <option value="Medicine staff">
                                Medicine staff
                            </option>

                            <option value="High skill tech staff">
                                High skill tech staff
                            </option>

                            <option value="IT staff">
                                IT staff
                            </option>

                            <option value="Security staff">
                                Security staff
                            </option>

                            <option value="Cooking staff">
                                Cooking staff
                            </option>

                            <option value="Cleaning staff">
                                Cleaning staff
                            </option>

                            <option value="Private service staff">
                                Private service staff
                            </option>

                            <option value="Secretaries">
                                Secretaries
                            </option>

                            <option value="Realty agents">
                                Realty agents
                            </option>

                            <option value="HR staff">
                                HR staff
                            </option>

                        </select>

                    </div>


                </div>


                <!-- ================================= -->
                <!-- CONTACT INFORMATION -->
                <!-- ================================= -->

                <h2>Contact Information</h2>

                <div class="form-grid">


                    <div class="form-group">

                        <label>Mobile Available</label>

                        <select name="FLAG_MOBIL" required>

                            <option value="1">
                                Yes
                            </option>

                            <option value="0">
                                No
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Work Phone</label>

                        <select name="FLAG_WORK_PHONE" required>

                            <option value="1">
                                Yes
                            </option>

                            <option value="0">
                                No
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Phone</label>

                        <select name="FLAG_PHONE" required>

                            <option value="1">
                                Yes
                            </option>

                            <option value="0">
                                No
                            </option>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <select name="FLAG_EMAIL" required>

                            <option value="1">
                                Yes
                            </option>

                            <option value="0">
                                No
                            </option>

                        </select>

                    </div>


                </div>


                <!-- ================================= -->
                <!-- SUBMIT -->
                <!-- ================================= -->

                <button
                    type="submit"
                    class="predict-button"
                >
                    Predict Credit Risk
                </button>


            </form>

        </div>

    </div>


    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script>

        const ageInput =
            document.getElementById("age");

        const daysBirth =
            document.getElementById("days_birth");


        const employmentInput =
            document.getElementById("employment_years");

        const daysEmployed =
            document.getElementById("days_employed");


        function updateDatasetValues() {

            const age =
                parseFloat(ageInput.value);

            const employment =
                parseFloat(
                    employmentInput.value
                );


            // Dataset stores age as
            // negative number of days.

            if (!isNaN(age)) {

                daysBirth.value =
                    Math.round(
                        -age * 365.25
                    );

            }


            // Dataset stores employment
            // duration as negative days.

            if (!isNaN(employment)) {

                daysEmployed.value =
                    Math.round(
                        -employment * 365.25
                    );

            }

        }


        ageInput.addEventListener(
            "input",
            updateDatasetValues
        );


        employmentInput.addEventListener(
            "input",
            updateDatasetValues
        );


        document.querySelector("form")
            .addEventListener(
                "submit",
                function () {

                    updateDatasetValues();

                }
            );

    </script>

</body>

</html>
